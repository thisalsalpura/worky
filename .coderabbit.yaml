language: "en-US"

reviews:
  profile: "assertive"
  path_filters:
    - "!**/.idea/**"
    - "!**/.next/**"
    - "!**/.vscode/**"
    - "!**/build/**"
    - "!**/coverage/**"
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!**/out/**"
    - "!**/target/**"
    - "!**/tmp/**"
    - "!**/temp/**"
    - "!**/*.log"
    - "!**/.coderabbit.yaml"
    - "!**/.DS_Store"
    - "!**/Thumbs.db"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  poem: false

  auto_review:
    enabled: true
    drafts: true
    base_branches:
      - main

chat:
  auto_reply: true
